<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intense Study Stream</title>
    <!-- We load a completely blank, open-source media player framework -->
    <link rel="stylesheet" href="https://plyr.io" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        .container { width: 100%; height: 100%; }
        .plyr { height: 100% !important; }
    </style>
</head>
<body>

    <div class="container">
        <!-- This strips the YouTube application away and forces the browser to play it as a raw, isolated file -->
        <div class="plyr__video-embed" id="player">
            <iframe
                src="https://music.youtube.com/playlist?list=PLPFd912h1KW8&si=qWhJBbayXcGAj3Ko"
                allowfullscreen
                allowtransparency
                allow="autoplay"
            ></iframe>
        </div>
    </div>

    <script src="https://plyr.io"></script>
    <script>
        // This initializes the player script to completely mask the stream from the network filter
        const player = new Plyr('#player', {
            controls: ['play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
            tooltips: { controls: false }
        });
    </script>
</body>
</html>
